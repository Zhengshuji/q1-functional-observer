name: build

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Paper I entry point
        run: |
          lake build Q1Paper.PaperI.S00_Interface.MainTheorems
          lake env lean PaperI.lean
          lake build Q1Paper.PaperI.Read.All
      - name: Paper I axiom audit
        run: |
          lake env lean Q1Paper/PaperI/S00_Interface/Audit.lean > paperI_audit.log
          python3 scripts/check_paperI_axioms.py paperI_audit.log Q1Paper/PaperI/S00_Interface/Audit.lean
      - name: Paper II entry point and audit
        run: |
          lake build Q1Paper.PaperII.MainTheorems
          lake env lean Q1Paper/PaperII/ClaimsCheck.lean
          lake build Q1Paper.PaperII.Read.All
          lake env lean Q1Paper/PaperII/Audit.lean > paperII_audit.log
          python3 scripts/check_paperI_axioms.py paperII_audit.log Q1Paper/PaperII/Audit.lean
      - name: Claim and module indexes (Paper I and Paper II)
        run: |
          lake env lean Q1Paper/PaperI/S00_Interface/ClaimsCheck.lean
          python3 scripts/generate_paperI_claims.py --check
          python3 scripts/generate_paperI_modules.py --check
          python3 scripts/generate_paperII_modules.py --check
          python3 scripts/generate_paperII_claims.py --check
          python3 scripts/generate_audit.py --check
          python3 scripts/paper_lean_index.py --check
          python3 scripts/generate_reading_entries.py --check
          python3 scripts/check_consistency.py
          python3 scripts/check_pdf_fresh.py
          python3 scripts/check_audit_coverage.py

  paper:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [paper_I_dec, paper_II_minorder]
    steps:
      - uses: actions/checkout@v4
      - name: Compile ${{ matrix.root }}
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: ${{ matrix.root }}.tex
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.root }}
          path: paper/${{ matrix.root }}.pdf

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sympy
        run: pip install sympy
      - name: Exact checks on the paper's identities
        working-directory: verification
        env:
          PYTHONPATH: "."
        run: |
          python ci/c317_cauchy_binet_random.py
          python ci/c318_r0_linear_system.py
          python ci/c319_encoding_and_rowspace.py
          python ../scripts/verify_paperII_example.py
      - name: Algorithm test suites
        working-directory: verification
        env:
          PYTHONPATH: "."
        run: |
          python test_decide.py
          python test_fpt.py
