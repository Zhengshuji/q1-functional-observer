name: build

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Paper I entry point
        run: |
          lake build Q1Paper.PaperI.MainTheorems
          lake env lean PaperI.lean
      - name: Axiom audit
        run: lake env lean Q1Paper/Audit.lean
      - name: Paper I axiom audit
        run: |
          lake env lean Q1Paper/PaperI/Audit.lean > paperI_audit.log
          python3 scripts/check_paperI_axioms.py paperI_audit.log

  paper:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [paper_I_dec, paper_II_minorder, paper_III_hyperplane]
    steps:
      - uses: actions/checkout@v4
      - name: Compile ${{ matrix.root }}
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: ${{ matrix.root }}.tex
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.root }}
          path: paper/${{ matrix.root }}.pdf

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sympy
        run: pip install sympy
      - name: Exact checks on the paper's identities
        working-directory: verification
        env:
          PYTHONPATH: "."
        run: |
          python ci/c317_cauchy_binet_random.py
          python ci/c318_r0_linear_system.py
          python ci/c319_encoding_and_rowspace.py
